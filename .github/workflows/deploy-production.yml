name: Validate and deploy production

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jhapu-docs-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: jhapu-docs-prod-931996386755
  CLOUDFRONT_DISTRIBUTION_ID: E16N8AVWLZ4NHB

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test rendered documentation
        run: npm run test

      - name: Build AWS static export
        run: npm run build:aws

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AWS static export
        run: npm run build:aws

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::931996386755:role/JhapuDocsGitHubDeploy
          role-session-name: jhapu-docs-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "931996386755"

      - name: Upload immutable application assets
        run: |
          aws s3 sync out/_next/static/ "s3://$S3_BUCKET/_next/static/" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Publish documentation
        run: |
          aws s3 sync out/ "s3://$S3_BUCKET/" \
            --delete \
            --exclude "_next/static/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Refresh CloudFront
        shell: bash
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"

      - name: Verify live documentation
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://docs.jhapu.com/ > /dev/null
